[project]
name = "qublitz2026"
version = "0.1.0"
description = "Exact, cost-aware quantum circuit optimizer (Qublitz 2026 Quantum Circuit Golf)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
qublitz2026 = "qublitz2026:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
